[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-ai-egress-policy-guard"
version = "0.1.0"
description = "Deterministic GitOps guard for Kubernetes AI workload egress policy"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
kubernetes-ai-egress-guard = "kubernetes_ai_egress_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
